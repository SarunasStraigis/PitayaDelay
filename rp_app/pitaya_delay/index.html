<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Pitaya Delay</title>
  <style>
    body { font-family: sans-serif; margin: 1.5rem; background: #111; color: #eee; }
    label { display: inline-block; min-width: 7rem; }
    pre { background: #222; padding: 1rem; overflow: auto; }
    button, select, input { margin: 0.2rem; }
  </style>
</head>
<body>
  <h1>Pitaya Delay</h1>
  <p>
    <label>mode</label>
    <select id="mode">
      <option>tdc</option>
      <option>dmtd</option>
      <option>hybrid</option>
    </select>
    <button id="apply">Apply</button>
  </p>
  <pre id="out">connecting…</pre>
  <script>
    const out = document.getElementById("out");
    async function tick() {
      try {
        const r = await fetch("/api/latest");
        out.textContent = JSON.stringify(await r.json(), null, 2);
      } catch (e) {
        out.textContent = String(e);
      }
    }
    document.getElementById("apply").onclick = async () => {
      await fetch("/api/config", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mode: document.getElementById("mode").value })
      });
    };
    setInterval(tick, 500);
    tick();
  </script>
</body>
</html>
